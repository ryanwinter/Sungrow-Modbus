# address is index from 0, subtract 1 from the published register

sungrowmodbus:
  - name: sungrow_sg8k
    host: rakmodule_775DEE.iot.home.arpa
    port: 502
    timeout: 10

    sensors:
      # Solar production
      # - name: daily_power_yields
      #   slave: 1
      #   data_type: uint16
      #   address: 5002
      #   input_type: input
      #   scale: 0.1
      #   precision: 2
      #   unit_of_measurement: kWh
      #   device_class: energy
      #   state_class: total_increasing
      - name: total_power_yields
        slave: 1
        scale: 0.1
        precision: 2
        data_type: uint32
        swap: word
        address: 5143
        input_type: input
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing

      - name: total_active_power
        slave: 1
        data_type: uint32
        address: 5030
        swap: word
        input_type: input
        unit_of_measurement: W
        device_class: power
        state_class: total_increasing

      # Grid
      - name: grid_frequency
        slave: 1
        data_type: uint16
        address: 5148
        input_type: input
        scale: 0.1
        precision: 2
        unit_of_measurement: Hz
        device_class: frequency
        state_class: measurement

      # Grid export
      # - name: daily_export_energy
      #   slave: 1
      #   scale: 0.1
      #   precision: 2
      #   data_type: uint32
      #   swap: word
      #   address: 5092
      #   input_type: input
      #   unit_of_measurement: kWh
      #   device_class: energy
      #   state_class: total_increasing

      - name: total_export_energy
        slave: 1
        scale: 0.1
        precision: 2
        data_type: uint32
        swap: word
        address: 5094
        input_type: input
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing

      # Grid import
      # - name: daily_import_energy
      #   slave: 1
      #   scale: 0.1
      #   precision: 2
      #   data_type: uint32
      #   swap: word
      #   address: 5096
      #   input_type: input
      #   unit_of_measurement: kWh
      #   device_class: energy
      #   state_class: total_increasing

      - name: total_import_energy
        slave: 1
        scale: 0.1
        precision: 2
        data_type: uint32
        swap: word
        address: 5098
        input_type: input
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing

      # Consumption
      # - name: daily_direct_energy_consumption
      #   slave: 1
      #   scale: 0.1
      #   precision: 2
      #   data_type: uint32
      #   swap: word
      #   address: 5100
      #   input_type: input
      #   unit_of_measurement: kWh
      #   device_class: energy
      #   state_class: total_increasing

      - name: total_direct_energy_consumption
        slave: 1
        scale: 0.1
        precision: 2
        data_type: uint32
        swap: word
        address: 5102
        input_type: input
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
