# address is index from 0, subtract 1 from the published register

sungrowmodbus:
  - name: sungrow_sg8k
    host: 10.0.12.172
    port: 502
    delay: 15
    timeout: 30

    sensors:
      # Info
      - name: serial_number
        address: 4989 # reg 4990
        data_type: string
        count: 10
        input_type: input
        scan_interval: &scan_interval_slow 600

      - name: device_type_code
        address: 4999 # reg 5000
        data_type: uint16
        input_type: input
        scan_interval: *scan_interval_slow

      - name: inverter_temperature
        address: 5007 # reg 5008
        data_type: int16
        input_type: input
        scale: 0.1
        precision: 0
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        scan_interval: &scan_interval_medium 60

      # Solar production
      # - name: daily_power_yields
      #   data_type: uint16
      #   address: 5002
      #   input_type: input
      #   scale: 0.1
      #   precision: 2
      #   unit_of_measurement: kWh
      #   device_class: energy
      #   state_class: total_increasing

      - name: total_power_yields
        address: 5143 # reg 5144
        data_type: uint32
        swap: word
        input_type: input
        scale: 0.1
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: &scan_interval_fast 30

      - name: total_active_power
        address: 5030 # reg 5031
        data_type: uint32
        swap: word
        input_type: input
        scale: 1
        precision: 0
        unit_of_measurement: W
        device_class: power
        state_class: total_increasing
        scan_interval: *scan_interval_fast

      # Grid
      - name: grid_frequency
        address: 5147 # reg 5148
        data_type: uint16
        input_type: input
        scale: 0.01
        precision: 2
        unit_of_measurement: Hz
        device_class: frequency
        state_class: measurement
        scan_interval: *scan_interval_fast

      # Grid export
      # - name: daily_export_energy
      #   scale: 0.1
      #   precision: 2
      #   data_type: uint32
      #   swap: word
      #   address: 5092
      #   input_type: input
      #   unit_of_measurement: kWh
      #   device_class: energy
      #   state_class: total_increasing

      - name: total_export_energy
        address: 5094 # reg 5095
        data_type: uint32
        swap: word
        input_type: input
        scale: 0.1
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: *scan_interval_fast

      # Grid import
      # - name: daily_import_energy
      #   scale: 0.1
      #   precision: 2
      #   data_type: uint32
      #   swap: word
      #   address: 5096
      #   input_type: input
      #   unit_of_measurement: kWh
      #   device_class: energy
      #   state_class: total_increasing

      - name: total_import_energy
        address: 5098 # reg 5099
        data_type: uint32
        swap: word
        input_type: input
        scale: 0.1
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: *scan_interval_fast

      # Consumption
      # - name: daily_direct_energy_consumption
      #   scale: 0.1
      #   precision: 2
      #   data_type: uint32
      #   swap: word
      #   address: 5100
      #   input_type: input
      #   unit_of_measurement: kWh
      #   device_class: energy
      #   state_class: total_increasing

      - name: total_direct_energy_consumption
        address: 5102 # reg 5103
        data_type: uint32
        swap: word
        input_type: input
        scale: 0.1
        precision: 1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        scan_interval: *scan_interval_fast
